<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Web Snapshot</title>
  <link rel="stylesheet" href="../assets/css/app.css">
  <style>
    .shot-wrap { max-height: 70vh; overflow: auto; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface-2); text-align: center; }
    .shot-wrap img { max-width: 100%; display: block; margin: 0 auto; }
    .history { list-style: none; margin: 0; padding: 0; }
    .history li { display: flex; gap: 10px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 12.5px; }
    .history li:last-child { border-bottom: 0; }
    .history .h-url { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .history time { color: var(--text-faint); font-family: var(--mono); font-size: 11.5px; }
  </style>
</head>
<body data-root="..">
  <main>
    <div class="page-head">
      <h2>Web Snapshot</h2>
      <p>URL を指定して Web サイトのスクリーンショットを取得します (<a href="https://jina.ai/reader" target="_blank" rel="noopener">Jina Reader</a> のスクリーンショット機能を利用)。</p>
    </div>

    <form class="card" id="ws-form" onsubmit="return false" novalidate>
      <div class="row">
        <input type="url" id="ws-url" placeholder="https://example.com/" style="flex:1; min-width:240px" data-persist="url" autocomplete="url">
        <div class="seg" role="radiogroup" aria-label="撮影範囲">
          <label><input type="radio" name="ws-mode" value="screenshot" checked data-persist="mode"><span>表示範囲</span></label>
          <label><input type="radio" name="ws-mode" value="pageshot" data-persist="mode"><span>ページ全体</span></label>
        </div>
        <button type="submit" class="btn btn-primary" id="ws-go">📸 取得</button>
        <button type="button" class="btn btn-danger" id="ws-cancel" hidden>中止</button>
      </div>

      <div class="fields" style="margin-top:14px">
        <div class="field">
          <label for="ws-preset">ビューポート</label>
          <select id="ws-preset" data-persist="preset"></select>
        </div>
        <div class="field">
          <label for="ws-w">幅 (px)</label>
          <input type="number" id="ws-w" min="200" max="3840" value="1280" data-persist="w">
        </div>
        <div class="field">
          <label for="ws-h">高さ (px)</label>
          <input type="number" id="ws-h" min="200" max="4320" value="800" data-persist="h">
        </div>
        <div class="field">
          <label for="ws-dpr">解像度倍率</label>
          <select id="ws-dpr" data-persist="dpr">
            <option value="1">1x</option>
            <option value="2">2x (Retina)</option>
            <option value="3">3x</option>
          </select>
        </div>
      </div>

      <details class="adv" style="margin-top:12px">
        <summary>詳細オプション</summary>
        <div class="fields">
          <div class="field">
            <label for="ws-wait">表示を待つ要素 (CSS セレクタ)</label>
            <input type="text" id="ws-wait" class="mono" placeholder="#main" data-persist="wait">
          </div>
          <div class="field">
            <label for="ws-remove">除去する要素 (CSS セレクタ)</label>
            <input type="text" id="ws-remove" class="mono" placeholder=".cookie-banner, #ads" data-persist="remove">
          </div>
          <div class="field">
            <label for="ws-timeout">タイムアウト (秒)</label>
            <input type="number" id="ws-timeout" min="5" max="180" value="60" data-persist="timeout">
          </div>
          <div class="field">
            <label for="ws-format">保存形式</label>
            <select id="ws-format" data-persist="format">
              <option value="original">そのまま (PNG)</option>
              <option value="jpeg">JPEG</option>
              <option value="webp">WebP</option>
            </select>
          </div>
        </div>
        <div class="row" style="margin-top:10px">
          <label class="check"><input type="checkbox" id="ws-nocache" data-persist="nocache"> キャッシュを使わない</label>
        </div>
      </details>
    </form>

    <div class="card" id="ws-result" hidden>
      <h3><span id="ws-result-title">スクリーンショット</span><span class="spacer"></span>
        <button type="button" class="btn btn-sm btn-primary" id="ws-save">保存</button>
        <a class="btn btn-sm" id="ws-open" target="_blank" rel="noopener">新しいタブで開く</a>
        <button type="button" class="btn btn-sm" id="ws-copy-url">画像URLをコピー</button>
      </h3>
      <div class="row hint" id="ws-result-meta" style="margin-bottom:10px"></div>
      <div class="shot-wrap"><img id="ws-img" alt="スクリーンショット"></div>
      <p class="hint" style="margin:8px 0 0">※ 画像 URL は Jina 側で一定期間後に失効します。必要なものは保存してください。</p>
    </div>

    <div class="grid grid-2">
      <div class="card">
        <h3>Jina Reader 設定</h3>
        <div id="ws-jina"></div>
      </div>
      <div class="card">
        <h3>履歴 <span class="spacer"></span><button type="button" class="btn btn-sm" id="ws-history-clear">クリア</button></h3>
        <ul class="history" id="ws-history"></ul>
      </div>
    </div>
  </main>

  <script src="../assets/js/yaml.js"></script>
  <script src="../assets/js/core.js"></script>
  <script src="../assets/js/shell.js"></script>
  <script src="../assets/js/lib/image.js"></script>
  <script src="../assets/js/lib/jina.js"></script>
  <script src="web-snapshot.js"></script>
</body>
</html>
