<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>パスワード生成</title>
  <link rel="stylesheet" href="../assets/css/app.css">
</head>
<body data-root="..">
  <main>
    <div class="page-head">
      <h2>パスワード生成</h2>
      <p>ブラウザの暗号論的乱数 (crypto.getRandomValues) で生成します。生成結果は保存されません (設定のみ保存)。</p>
    </div>

    <div class="grid grid-2">
      <form class="card" id="pw-form" autocomplete="off" onsubmit="return false">
        <h3>生成条件</h3>
        <div class="row" style="margin-bottom:12px">
          <span class="hint">プリセット:</span>
          <button type="button" class="btn btn-sm" data-preset="standard">標準 (16桁)</button>
          <button type="button" class="btn btn-sm" data-preset="strong">強力 (32桁)</button>
          <button type="button" class="btn btn-sm" data-preset="alnum">英数字のみ (20桁)</button>
          <button type="button" class="btn btn-sm" data-preset="pin">PIN (6桁)</button>
        </div>

        <div class="field">
          <label for="pw-length">長さ <span id="pw-length-label" class="tag tag-primary">16</span></label>
          <div class="row">
            <input type="range" id="pw-length-range" min="4" max="128" value="16" style="flex:1">
            <input type="number" id="pw-length" min="1" max="1024" value="16" style="width:90px" data-persist="length">
          </div>
        </div>

        <div class="field" style="margin-top:12px">
          <span class="label">使用する文字</span>
          <div class="row">
            <label class="check"><input type="checkbox" id="pw-upper" checked data-persist="upper"> 大文字 A-Z</label>
            <label class="check"><input type="checkbox" id="pw-lower" checked data-persist="lower"> 小文字 a-z</label>
            <label class="check"><input type="checkbox" id="pw-digit" checked data-persist="digit"> 数字 0-9</label>
            <label class="check"><input type="checkbox" id="pw-symbol" checked data-persist="symbol"> 記号</label>
          </div>
        </div>

        <div class="fields" style="margin-top:12px">
          <div class="field" style="grid-column: 1 / -1">
            <label for="pw-symbols">記号の候補</label>
            <input type="text" id="pw-symbols" class="mono" value="!@#$%^&*()-_=+[]{};:,.?/" data-persist="symbols">
          </div>
          <div class="field">
            <label for="pw-exclude">除外する文字</label>
            <input type="text" id="pw-exclude" class="mono" placeholder="例: '&quot;`\" data-persist="exclude">
          </div>
          <div class="field">
            <label for="pw-count">生成数</label>
            <input type="number" id="pw-count" min="1" max="10000" value="5" data-persist="count">
          </div>
        </div>

        <div class="row" style="margin-top:12px">
          <label class="check"><input type="checkbox" id="pw-ambiguous" checked data-persist="ambiguous"> 紛らわしい文字を除外 (I l 1 O 0 o)</label>
          <label class="check"><input type="checkbox" id="pw-require" checked data-persist="require"> 選択した文字種を必ず含める</label>
          <label class="check"><input type="checkbox" id="pw-norepeat" data-persist="norepeat"> 同じ文字の連続を避ける</label>
        </div>

        <div class="row" style="margin-top:16px">
          <button type="button" class="btn btn-primary" id="pw-generate">🔑 生成する</button>
          <span class="hint" id="pw-pool"></span>
        </div>
      </form>

      <div class="card">
        <h3>生成結果 <span class="spacer"></span>
          <button type="button" class="btn btn-sm" id="pw-copy-all" disabled>すべてコピー</button>
          <button type="button" class="btn btn-sm" id="pw-dl-txt" disabled>TXT</button>
          <button type="button" class="btn btn-sm" id="pw-dl-csv" disabled>CSV</button>
        </h3>
        <div class="field" style="margin-bottom:12px">
          <div class="row" style="justify-content:space-between">
            <span class="hint">推定強度 <strong id="pw-strength-label">-</strong></span>
            <span class="hint" id="pw-entropy">- bit</span>
          </div>
          <div class="meter"><div id="pw-meter"></div></div>
        </div>
        <div id="pw-results" class="stack"><div class="empty">「生成する」を押してください</div></div>
      </div>
    </div>

    <div class="card">
      <h3>パスワード強度チェック</h3>
      <p class="card-sub">入力したパスワードは送信・保存されません。文字種と長さから総当たり時のエントロピーを概算します。</p>
      <div class="row">
        <input type="password" id="pw-check" class="mono" placeholder="チェックするパスワード" style="flex:1; min-width:220px" autocomplete="off">
        <label class="check"><input type="checkbox" id="pw-check-show"> 表示</label>
      </div>
      <div class="row" style="margin-top:8px"><span id="pw-check-result" class="hint">-</span></div>
    </div>
  </main>

  <script src="../assets/js/yaml.js"></script>
  <script src="../assets/js/core.js"></script>
  <script src="../assets/js/shell.js"></script>
  <script src="password.js"></script>
</body>
</html>
